name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        edition: [cli, tui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.edition == 'cli'
        run: python -m pip install -e '.[test]'
      - if: matrix.edition == 'tui'
        run: python -m pip install -e '.[test,tui]'
      - run: python -m pip wheel --wheel-dir "${{ runner.temp }}/codex-socks-wheels" '.[tui]' 'setuptools>=68' wheel
      - run: pytest
        env:
          CODEX_SOCKS_TEST_WHEELHOUSE: ${{ runner.temp }}/codex-socks-wheels
          CODEX_SOCKS_TEST_EDITION: ${{ matrix.edition }}
      - run: python -m compileall -q src tests
      - run: python scripts/check-secrets.py
      - run: shellcheck .githooks/pre-commit scripts/install.sh
