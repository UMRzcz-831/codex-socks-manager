[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-socks-manager"
version = "0.2.0"
description = "Safely manage proxy profiles and Codex CLI runtime integration on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UMRzcz-831" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=8.2.8,<9", "rich>=14.2.0,<15"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
codex-socks = "codex_socks_manager.cli:main"
codex-proxy-guard = "codex_socks_manager.cli:guard_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_socks_manager = ["*.tcss"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
