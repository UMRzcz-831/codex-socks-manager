[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-socks-manager"
version = "0.3.0"
description = "Safely manage proxy profiles and Codex CLI runtime integration on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "UMRzcz-831" }]
keywords = ["codex", "proxy", "socks5", "textual", "tui"]
classifiers = [
  "Environment :: Console",
  "Environment :: Console :: Curses",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/UMRzcz-831/codex-socks-manager"
Repository = "https://github.com/UMRzcz-831/codex-socks-manager"
Issues = "https://github.com/UMRzcz-831/codex-socks-manager/issues"
Changelog = "https://github.com/UMRzcz-831/codex-socks-manager/releases"

[project.optional-dependencies]
tui = ["textual>=8.2.8,<9", "rich>=14.2.0,<15"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
codex-socks = "codex_socks_manager.cli:main"
codex-proxy-guard = "codex_socks_manager.cli:guard_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_socks_manager = ["*.tcss"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
